<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FIFA World Cup 2026 – Lịch Thi Đấu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'TossEmoji';
  src: url('TossFaceFontWeb.otf') format('opentype');
  font-display: swap;
}

/* ─── RESET & BASE ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #161616;
  --bg2:         #1e1e1e;
  --card:        #1e1e1e;
  --card-hover:  #252525;
  --border:      #2a2a2a;
  --border2:     #333333;
  --primary:     #00985f;
  --primary-dim: rgba(0,152,95,0.15);
  --accent:      #4f9cf9;
  --live:        #e8344e;
  --live-dim:    rgba(232,52,78,0.12);
  --gold:        #f0b429;
  --text1:       #ffffff;
  --text2:       #999999;
  --text3:       #666666;
  --inter:       'Inter', sans-serif;
  --emoji:       'TossEmoji', sans-serif;
}

body {
  font-family: var(--inter);
  background: var(--bg);
  color: var(--text1);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}

button { font-family: var(--inter); cursor: pointer; border: none; background: none; }
a { text-decoration: none; color: inherit; }

.te { font-family: var(--emoji); font-style: normal; line-height: 1; }

/* ─── LAYOUT ────────────────────────────────────────────────── */
.content-area {
  background: var(--bg);
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  isolation: isolate;
}

.page-wrap {
  max-width: 960px;
  margin: 0 auto;
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
  padding-top: 8px;
}

/* ═══ HEADER (Figma spec rebuild) ════════════════════════════ */

/* Unified sticky header: logo row (52px) + filter row (40px) = 92px */
.site-header {
  position: -webkit-sticky;
  position: sticky;
  top: 0;
  z-index: 103;
  clip-path: inset(0);
  -webkit-clip-path: inset(0);
  /* Safe area: đẩy content xuống dưới notch/status bar trên iOS/Android */
  padding-top: env(safe-area-inset-top);
}

/* Header background — FotMob style: pure CSS multi-layer radial-gradient
   Không dùng filter:blur trên div riêng → không tạo stacking context
   Tất cả layers nằm trong 1 property background duy nhất */
.header-bg {
  position: absolute;
  inset: 0;
  backdrop-filter: blur(32px) saturate(140%);
  -webkit-backdrop-filter: blur(32px) saturate(140%);
  background:
    /* Layer 1: green blob — left */
    radial-gradient(ellipse 55% 130% at -12% 55%,
      rgba(0, 160, 60, 0.42) 0%,
      rgba(0, 90, 30, 0.18) 52%,
      transparent 72%
    ),
    /* Layer 2: red blob — right */
    radial-gradient(ellipse 50% 120% at 112% 40%,
      rgba(185, 25, 25, 0.40) 0%,
      rgba(110, 15, 15, 0.16) 52%,
      transparent 72%
    ),
    /* Layer 3: dark center vignette — giữ nền sạch */
    radial-gradient(ellipse 60% 80% at 50% 50%,
      transparent 30%,
      rgba(4, 8, 20, 0.35) 100%
    ),
    /* Layer 4: deep navy base */
    linear-gradient(115deg, #060c1e 0%, #0a1232 40%, #0c1840 70%, #08102e 100%);
}

/* Blobs divs no longer needed — kept empty for DOM compatibility */
.header-blob1, .header-blob2, .header-blob3 { display: none; }

/* Bottom edge — phân tách header với content */
.site-header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255,255,255,0.06) 20%,
    rgba(255,255,255,0.10) 50%,
    rgba(255,255,255,0.06) 80%,
    transparent 100%
  );
  z-index: 2;
}

/* Row 1: Logo + refresh (height 52px per Figma: top:16px, height:36px → row~52px) */
.header-logo-row {
  position: relative;
  z-index: 1;
  height: 52px;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 24px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo-icon img {
  height: 36px; width: auto;
  object-fit: contain; display: block;
  filter: drop-shadow(0px 0px 2px rgba(0,0,0,0.3));
}

.logo-titles { display: flex; flex-direction: column; gap: 0; }
.logo-text { font-size: 12px; font-weight: 700; color: #fff; line-height: 15px; }
.logo-sub  { font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.55); line-height: 15px; }

.header-actions { flex-shrink: 0; }

/* Refresh button — Figma: 32×32px, border:1px solid rgba(255,255,255,0.05), radius:30px */
.refresh-btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.2s cubic-bezier(.34,1.56,.64,1);
  outline: none;

  /* Core glass: backdrop blur */
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);

  /* Glass fill: semi-transparent white */
  background: rgba(255,255,255,0.12);

  /* Gradient border via border-image trick using outline+pseudo */
  border: none;
  box-shadow:

    /* inner top highlight */
    inset 0 1px 0 rgba(255,255,255,0.45),
    /* inner bottom shadow */
    inset 0 -1px 0 rgba(0,0,0,0.15),
 
}
.refresh-btn:hover {
  background: rgba(255,255,255,0.18);
  transform: scale(1.06);
}

.refresh-btn:active {
  transform: scale(0.91);
  background: rgba(255,255,255,0.08);
  transition: transform 0.1s ease;
}

.refresh-btn:disabled {
  opacity: 0.35;
  cursor: wait;
  transform: none;
}

.refresh-btn svg {
  width: 17px;
  height: 17px;
  display: block;
  position: relative;
  z-index: 3;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  flex-shrink: 0;
}

.refresh-btn.spinning svg {
  animation: spinOnce 0.65s cubic-bezier(.4,0,.2,1);
}

@keyframes spinOnce {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* Row 2: Filter chips (height 40px per Figma: bottom:40px, height:40px) */
.header-filter-row {
  position: relative;
  z-index: 1;
  height: 44px;
}


.filter-scroll {
  padding: 0 16px;
  gap: 16px;
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  height: 44px;
  align-items: center;
}
.filter-scroll::-webkit-scrollbar { display: none; }

/* Filter chip */
.filter-chip {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  border: none;
  background: transparent;
  flex-shrink: 0;
  opacity: 0.7;
  transition: opacity 0.18s ease;
  padding: 0;
}
.filter-chip:hover  { opacity: 0.85; }
.filter-chip.active { opacity: 1; }

/* Dot indicator */
.filter-chip::after {
  content: '';
  display: block;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: transparent;
  transition: background 0.18s ease;
  flex-shrink: 0;
}
.filter-chip.active::after { background: #ffffff; }

/* Trophy icon for "Tất cả" */
.chip-trophy {
  width: 22px; height: 22px;
  display: block;
  object-fit: contain;
  mix-blend-mode: screen;
}

/* Flag chips */
.filter-chip.flag-only .chip-flag { font-size: 26px; line-height: 1; display: block; }
.chip-flag { font-size: 14px; line-height: 1; }


/* ─── VIEW BAR — inside site-header, Figma spec ─────────────── */
/* view-bar is positioned inside .site-header, uses parent's background */
.view-bar {
  display: none;
  height: 40px;
  padding: 0 16px;
  gap: 20px;
  overflow-x: auto;
  scrollbar-width: none;
  position: relative;
  z-index: 1;
  align-items: center;
}
.view-bar::-webkit-scrollbar { display: none; }
.view-bar.show { display: flex; }

.view-tabs {
  display: flex;
  gap: 20px;
  align-items: center;
  flex-shrink: 0;
}

/* Figma: active weight:700 opacity:1 | inactive weight:400 opacity:0.45 */
.view-tab {
  padding: 6px 0;
  font-size: 13px;
  font-weight: 400;
  line-height: 16px;
  color: #ffffff;
  opacity: 0.45;
  cursor: pointer;
  border: none;
  background: transparent;
  white-space: nowrap;
  transition: opacity 0.12s;
  font-family: var(--inter);
  flex-shrink: 0;
}
.view-tab:hover  { opacity: 0.75; }
.view-tab.active { opacity: 1; font-weight: 700; }





/* Group select */
.group-select-wrap { display: none; align-items: center; gap: 8px; }
.group-select-wrap.show { display: flex; }
/* Select bảng — sticky dưới site-header (52+40+40=132px) */
.group-select-wrap.page-select {
  display: none;
  position: sticky;
  top: 136px;
  z-index: 101;
  padding: 8px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  flex-direction: row;
  align-items: center;
  gap: 8px;
}
.group-select-wrap.page-select.show { display: flex; }

.best3-btn {
  flex-shrink: 0;
  height: 30px;
  padding: 0 14px;
  border-radius: 8px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text2);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  font-family: var(--inter);
}
.best3-btn:hover { border-color: var(--text3); color: var(--text1); }
.best3-btn.active {
  background: rgba(0,152,95,0.15);
  border-color: #00985f;
  color: #00985f;
}


.group-select {
  appearance: none; -webkit-appearance: none;
  background: #222;
  color: #fff;
  border: 1px solid var(--border2);
  border-radius: 8px;
  height: 30px;
  padding: 6px 28px 6px 12px;
  font-size: 12.5px;
  font-weight: 500;
  font-family: var(--inter);
  cursor: pointer;
  outline: none;
  background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23999' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 10px center;
}
.group-select:hover { border-color: rgba(255,255,255,0.2); }
.group-select option { background: #1e1e1e; color: #fff; }

/* Refresh button (liquid glass) */
.refresh-btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.2s cubic-bezier(.34,1.56,.64,1);
  outline: none;

  /* Core glass: backdrop blur */
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);

  /* Glass fill: semi-transparent white */
  background: rgba(255,255,255,0.12);

  /* Gradient border via border-image trick using outline+pseudo */
  border: none;
  box-shadow:

    /* inner top highlight */
    inset 0 1px 0 rgba(255,255,255,0.45),
    /* inner bottom shadow */
    inset 0 -1px 0 rgba(0,0,0,0.15),
 
}


.refresh-btn:hover {
  background: rgba(255,255,255,0.18);
  transform: scale(1.06);
}

.refresh-btn:active {
  transform: scale(0.91);
  background: rgba(255,255,255,0.08);
  transition: transform 0.1s ease;
}

.refresh-btn:disabled {
  opacity: 0.35;
  cursor: wait;
  transform: none;
}

.refresh-btn svg {
  width: 17px;
  height: 17px;
  display: block;
  position: relative;
  z-index: 3;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  flex-shrink: 0;
}

.refresh-btn.spinning svg {
  animation: spinOnce 0.65s cubic-bezier(.4,0,.2,1);
}

@keyframes spinOnce {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* Responsive */
@media (max-width: 640px) {
  .header-logo-row { height: 56px; padding: 0 14px; }
  .group-select-wrap.page-select { top: 140px; } /* logo(56)+chips(44)+viewbar(40) */
  .logo-text { font-size: 15px; }
   /* 56+44 */
}

/* ─── GROUP BLOCK ────────────────────────────────────────────── */
.group-block {
  margin: 0 16px 16px;
  background: transparent;
  border-radius: 0;
  overflow: visible;
  border: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.group-label-row {
  padding: 10px 0;
  border-bottom: none;
  display: flex;
  align-items: center;
  gap: 9px;
  background: transparent;
  border-radius: 0;
  height: 40px;
}

.group-pill {
  font-size: 14px;
  font-weight: 700;
  line-height: 18px;
  color: #ffffff;
  background: none;
  padding: 0;
  border-radius: 0;
  white-space: nowrap;
}

.group-teams-text {
  font-size: 12px;
  font-weight: 300;
  line-height: 14px;
  color: #666666;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.group-icon-right { display: none; }

/* ─── MATCH ROW — Figma spec ─────────────────────────────────── */

/* Each match-row is its own card */
.match-row {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 10px 0 0 4px;
  gap: 2px;
  background: #1E1E1E;
  border-radius: 16px;
  overflow: hidden;
  transition: background 0.12s;
  cursor: default;
}

.match-row + .match-row { border-top: none; }
.match-row:hover { background: #252525; }
.match-row:last-child { border-radius: 16px; }
.match-row:last-child:hover { border-radius: 16px; }

/* Status badge — absolute top-right corner */
.match-badge {
  position: absolute;
  top: 8px; right: 8px;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 400;
  line-height: 12px;
  z-index: 1;
  white-space: nowrap;
}

.match-badge.live     { background: rgba(0,180,90,0.15); color: #00b45a; }
.match-badge.halftime { background: rgba(255,180,0,0.15); color: #f0b429; }
.match-badge.finished { background: rgba(255,255,255,0.1); color: #aeaeae; }

@keyframes liveBlink { 0%,100%{opacity:1} 50%{opacity:0.5} }


/* ── Match Info block (column: time → score row → venue) ── */
.match-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0;
  gap: 4px;
  width: 100%;
}

/* Time row */
.match-time-row {
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: center;
  height: 13px;
}

.match-dt {
  font-size: 11px;
  font-weight: 400;
  line-height: 13px;
  color: #999999;
  white-space: nowrap;
}


/* Score row: team1 | score-block | team2 — grid với fixed center */
.match-score-row {
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: center;
  padding: 0px;
  gap: 0px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 80px minmax(0, 1fr);
  align-items: center;
  width: 100%;
  height: 30px;
  padding: 0 0 0 0;
}

/* Upcoming: full width center */
.match-score-row.upcoming {
  grid-template-columns: 1fr;
}
.match-score-row.upcoming .ms-team { display: none; }
.match-score-row.upcoming .ms-score-block { width: 100%; }
.match-score-row.upcoming .upcoming-time {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -1px;
}

/* Team block inside score row */
.ms-team {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  justify-content: flex-end;
  min-width: 0;
  overflow: hidden;
}

.ms-team.right {
  flex-direction: row;
  justify-content: flex-start;
  min-width: 0;
  overflow: hidden;
}

.ms-name {
  font-size: 14px; /* default */
  font-weight: 500;
  line-height: 1.2;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: calc(100% - 40px);
  min-width: 0;
}

/* Tên trung bình (10–13 ký tự): scale xuống nhẹ */
.ms-name.name-md { font-size: 14px; }

/* Tên dài (≥14 ký tự): scale nhỏ hơn */
.ms-name.name-lg { font-size: 10px; letter-spacing: -0.2px; }

.t-flag {
  font-size: 24px;
  display: block;
  line-height: 1;
  width: 28px;
  height: 24px;
}

.t-flag-img {
  display: block;
  width: 28px;
  height: 28px;
  object-fit: cover;
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.14);
}

.t-flag-wrap { position: relative; flex-shrink: 0; }

/* ── TBD placeholder flag ─────────────────────────────────────── */
.flag-tbd {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #2a2a2a;
  border: 1.5px dashed #444444;
  flex-shrink: 0;
}

.flag-tbd svg {
  width: 14px;
  height: 14px;
  opacity: 0.35;
}



/* Score block center — fixed width để align đều */
.ms-score-block {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  width: 80px;
  gap: 0;
}

/* Upcoming: show HH:MM in 20px bold */
.ms-score-block .upcoming-time {
  font-size: 20px;
  font-weight: 700;
  line-height: 24px;
  color: #ffffff;
  letter-spacing: -0.5px;
}

/* Live/finished: score digits */
.ms-sc {
  font-size: 20px;
  font-weight: 700;
  line-height: 24px;
  color: #ffffff;
  min-width: 14px;
  text-align: center;
  padding: 2px 6px;
}

.ms-dash {
  font-size: 20px;
  font-weight: 700;
  line-height: 24px;
  color: #ffffff;
  padding: 2px 4px;
}

/* Venue */
.match-venue-row {
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: center;
  gap: 8px;
  height: 32px;
  width: 100%;
  background: #1E1E1E;
  padding: 8px 0;
  margin-top: 0;
  border-top: 1px solid transparent;
  background-image: linear-gradient(#1E1E1E, #1E1E1E),
    linear-gradient(90deg, transparent 0%, #3a3a3a 30%, #3a3a3a 70%, transparent 100%);
  background-origin: border-box;
  background-clip: padding-box, border-box;
}

.venue-icon-svg {
  flex-shrink: 0;
  opacity: 0.45;
  display: flex;
  align-items: center;
}

.venue-text {
  font-size: 10px;
  font-weight: 400;
  line-height: 16px;
  color: #999999;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 240px;
  text-align: center;
}

/* FEATURED highlight removed */


/* ─── AI RESULT BOX ─────────────────────────────────────────── */
.ai-box {
  margin: 12px 20px 0;
  background: rgba(79,156,249,0.07);
  border: 1px solid rgba(79,156,249,0.18);
  border-radius: 16px;
  padding: 11px 14px;
  display: none;
  gap: 8px;
  align-items: flex-start;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--text2);
}

.ai-box.show { display: flex; }
.ai-box .ai-em { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.ai-box strong { color: var(--text1); font-weight: 600; }



/* ─── BOTTOM BAR ─────────────────────────────────────────────── */
.bottombar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 200;
  background: rgba(15,18,23,0.97);
  border-top: 1px solid var(--border);
  padding: 10px 16px;
  /* Safe area: tránh bị home indicator / gesture bar che */
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
}

.bar-em { font-size: 14px; flex-shrink: 0; }

.bar-text {
  font-size: 11.5px;
  color: var(--text3);
  flex: 1;
  line-height: 1.4;
}

.bar-text span { color: var(--accent); font-weight: 500; }

.bar-spinner {
  width: 13px; height: 13px;
  border: 2px solid rgba(79,156,249,0.2);
  border-top-color: var(--accent);
  border-radius: 50%;

  display: none; flex-shrink: 0;

@keyframes spin { to { transform: rotate(360deg); } }

/* ─── EMPTY STATE ────────────────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 56px 20px;
  color: var(--text3);
  display: none;
}
.empty-state.show { display: block; }
.es-em { font-size: 40px; margin-bottom: 10px; }
.es-title { font-size: 14px; color: var(--text2); font-weight: 500; margin-bottom: 4px; }
.es-sub { font-size: 12px; }

/* ─── RESPONSIVE ─────────────────────────────────────────────── */
@media (max-width: 640px) {
  .topbar-inner { height: 60px; }
  .logo-text { font-size: 15px; }
  .logo-icon { width: 34px; height: 34px; }
  .logo-icon img { width: 34px; height: 34px; }
  /* filter-bar is in flow inside site-header */
  
  .round-filter-bar { top: 136px; }
}
@media (max-width: 480px) {
  .t-name { max-width: 72px; font-size: 12px; }
  .score-n { font-size: 16px; }
  .match-row { padding: 10px 10px 12px; }
  .group-block { margin: 0 12px 16px; gap: 8px; }
  .section-head { padding: 18px 12px 8px; }
  /* refresh-btn responsive — already icon-only */
}

  0%   { background: rgba(0,200,100,0.25); border-radius: 4px; }
  100% { background: transparent; }

.score-flash { animation: scoreFlash 1.2s ease-out; }

// ─────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────
function fmtDate(dateStr, timeStr) {
  const d = new Date(dateStr + 'T' + timeStr + ':00+07:00');
  const DAYS = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
  const dd = d.getDate().toString().padStart(2,'0');
  const mm = (d.getMonth()+1).toString().padStart(2,'0');
  const hh = d.getHours().toString().padStart(2,'0');
  const mi = d.getMinutes().toString().padStart(2,'0');
  return {
    time: hh + ':' + mi,
    dateShort: DAYS[d.getDay()] + ' · ' + dd + '/' + mm,            // upcoming: no time
    date: DAYS[d.getDay()] + ' · ' + dd + '/' + mm + ' · ' + hh + ':' + mi, // live/finished
  };
}

function estimateLiveMinute(m) {
  if (!m || m.status !== 'live' || !m.date || !m.time) return null;
  const start = new Date(m.date + 'T' + m.time + ':00+07:00').getTime();
  if (!Number.isFinite(start)) return null;
  const elapsed = Math.floor((Date.now() - start) / 60000);
  if (elapsed < 0 || elapsed > 150) return null;
  if (elapsed >= 45 && elapsed <= 60 && !m.minute) return '45+';
  if (elapsed > 105) return '90+';
  return Math.max(1, elapsed);
}

function ensureLiveDisplayData(m) {
  if (!m || m.status !== 'live') return;
  // Nếu trận đang live nhưng feed chưa trả score, vẫn hiển thị 0 - 0 thay vì giờ đá.
  if (m.sh === null || m.sh === undefined) m.sh = 0;
  if (m.sa === null || m.sa === undefined) m.sa = 0;
  // Nếu feed chưa trả phút, dùng phút ước tính từ giờ kickoff để tránh chip "Live" trống thông tin.
  if (!m.minute && m.livePhase !== 'ht') {
    m.minute = estimateLiveMinute(m);
  }
}

function statusBadge(m) {
  const s = m.status;
  if (s === 'live') {
    if (m.livePhase === 'ht') {
      return `<span class="match-badge halftime">Hết H1</span>`;
    }
    const minute = m.minute || estimateLiveMinute(m);
    const label = minute ? `${minute}'` : 'Live';
    return `<span class="match-badge live">${label}</span>`;
  }
  if (s === 'finished') {
    return `<span class="match-badge finished">KT</span>`;
  }
  return ''; // upcoming: no badge
}

// RENDER
// ─────────────────────────────────────────────────────────────
function renderFlag(team) {
  // Placeholder for unknown knockout teams
  if (team.code === 'tbd' || !team.flag || team.flag === '🏳️' || team.flag === '\u{1F3F3}\uFE0F') {
    return `<span class="flag-tbd" title="${team.name || 'TBD'}">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8" cy="8" r="7" stroke="#666" stroke-width="1.2"/>
        <path d="M8 4v4l2.5 2.5" stroke="#666" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </span>`;
  }
  return `<span class="te t-flag">${team.flag}</span>`;
}

function renderMatchRow(m) {
  const isFeat = TARGET.has(m.home.code) || TARGET.has(m.away.code);
  const hFeat  = TARGET.has(m.home.code);
  const aFeat  = TARGET.has(m.away.code);
  const dt     = fmtDate(m.date, m.time);
  ensureLiveDisplayData(m);
  const hasScore = (m.sh !== null && m.sh !== undefined && m.sa !== null && m.sa !== undefined);

  const homeDot = hFeat ? `<span class="t-dot" style="background:${m.home.color}"></span>` : '';
  const awayDot = aFeat ? `<span class="t-dot" style="background:${m.away.color}"></span>` : '';

  // Score block center
  let scoreBlock;
  if (!hasScore) {
    // Upcoming: show HH:MM big
    scoreBlock = `<div class="ms-score-block">
      <span class="upcoming-time">${dt.time}</span>
    </div>`;
  } else {
    // Live or finished
    scoreBlock = `<div class="ms-score-block">
      <span class="ms-sc" id="sh-${m.id}">${m.sh}</span>
      <span class="ms-dash">-</span>
      <span class="ms-sc" id="sa-${m.id}">${m.sa}</span>
    </div>`;
  }

  const badge = statusBadge(m);
  const venue = m.venue || '';

  // Thẻ phạt — chỉ hiện khi trận finished và có data
  const hasCards = m.status === 'finished' && (m.homeYC || m.homeRC || m.awayYC || m.awayRC);
  const cardRow = hasCards ? `
    <div class="match-cards-row">
      <div class="cards-home">
        ${m.homeYC ? `<span class="card-icon yc">${m.homeYC}</span>` : ''}
        ${m.homeRC ? `<span class="card-icon rc">${m.homeRC}</span>` : ''}
      </div>
      <div class="cards-away">

// ─────────────────────────────────────────────────────────────
// Ranking helpers
// FIFA-style order used in group standings and Best 3rd:
// points → goal difference → goals for → fair-play → stable name fallback.
// Fair-play points: yellow=-1, yellowRed=-3, red=-4, yellowDirectRed=-5. Higher is better.
// ─────────────────────────────────────────────────────────────
function getTeamDiscipline(code) {
  return DISCIPLINE[code] ?? { yellow: 0, yellowRed: 0, red: 0, yellowDirectRed: 0 };
}

function getFairPlayScore(code) {
  const d = getTeamDiscipline(code);
  return (d.yellow || 0) * (-1) + (d.yellowRed || 0) * (-3) + (d.red || 0) * (-4) + (d.yellowDirectRed || 0) * (-5);
}

function compareStandingRows(a, b) {
  const gdA = (a.gf ?? 0) - (a.ga ?? 0);
  const gdB = (b.gf ?? 0) - (b.ga ?? 0);
  const fpA = getFairPlayScore(a.code);
  const fpB = getFairPlayScore(b.code);

  return (b.pts ?? 0) - (a.pts ?? 0) ||
         gdB - gdA ||
         (b.gf ?? 0) - (a.gf ?? 0) ||
         fpB - fpA ||
         String(a.name || '').localeCompare(String(b.name || ''), 'vi');
}

function teamKey(v) {
  return String(v || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]/g, '');
}

const TEAM_ALIASES = {
  england: ['england', 'anh'],
  germany: ['germany', 'duc', 'đức'],
  france: ['france', 'phap', 'pháp'],
  brazil: ['brazil', 'brasil'],
  argentina: ['argentina'],
  spain: ['spain', 'taybannha', 'tâybannha'],
  portugal: ['portugal', 'bodaonha', 'bồđàonha']
};

function matchHasTeam(m, team) {
  if (team === 'all') return true;
  const aliases = (TEAM_ALIASES[team] || [team]).map(teamKey);
  const homeKeys = [m.home?.code, m.home?.name, m.home?.shortName].map(teamKey);
  const awayKeys = [m.away?.code, m.away?.name, m.away?.shortName].map(teamKey);
  return aliases.some(a => homeKeys.includes(a) || awayKeys.includes(a));
}

// ─────────────────────────────────────────────────────────────
// BẢNG XẾP HẠNG ĐỘI ĐỨNG THỨ 3
// Tự tính từ STANDINGS data, sort theo: pts → hs → bt
// ─────────────────────────────────────────────────────────────
function getThirdPlaceRows() {
  // Dùng DISCIPLINE object — nhập thủ công sau mỗi trận
  // FP FIFA: yellow=-1, yellowRed=-3 (đỏ gián tiếp/2 vàng), red=-4, yellowDirectRed=-5
  return Object.entries(STANDINGS)
    .map(([group, rows]) => {
      const sorted = [...rows].sort(compareStandingRows);
      const t = sorted[2];
      if (!t) return null;
      const d = DISCIPLINE[t.code] ?? { yellow: 0, yellowRed: 0, red: 0, yellowDirectRed: 0 };
      const yc = d.yellow;
      const rc = (d.yellowRed || 0) + (d.red || 0) + (d.yellowDirectRed || 0);
      const fp = getFairPlayScore(t.code);
      return { ...t, group, yc, rc, fp };
    })
    .filter(Boolean)
    .sort(compareStandingRows);
}

    const rank = i + 1;

function renderStandingsTable(group, highlightCode) {
  const rows = STANDINGS[group];
  if (!rows) return '';

  const meta = GROUP_META[group] || { label: 'Grp. ' + group };

  const sortedRows = [...rows].sort(compareStandingRows);
  const rowsHtml = sortedRows.map((t, i) => {
    const rank = i + 1;
    const dotClass = rank === 1 ? 'q1' : rank === 2 ? 'q2' : 'out';
    const isTracked = t.code === highlightCode;
    const gd = (t.gf ?? 0) - (t.ga ?? 0);
    const gdClass = gd > 0 ? 'pos' : gd < 0 ? 'neg' : '';
    const hsText = gd > 0 ? '+' + gd : String(gd);
    const nameLen = t.name?.length ?? 0;
    const nameClass = nameLen > 16 ? 'name-xlong' : nameLen > 12 ? 'name-long' : '';

    return `
    <tr class="${isTracked ? 'tracked-row' : ''}">
      <td class="td-rank">${rank}</td>
      <td class="td-team">
        <div class="td-team-inner">
          <span class="te td-flag">${t.flag}</span>
          <span class="td-name ${nameClass}">${t.name}</span>
        </div>
      </td>
      <td>${t.pl}</td>
      <td>${t.w}</td>
      <td>${t.d}</td>
      <td>${t.l}</td>
      <td>${(t.gf ?? 0)}-${(t.ga ?? 0)}</td>
      <td class="td-gd ${gdClass}">${hsText}</td>
      <td class="td-pts">${t.pts}</td>
    </tr>`;
  }).join('');

  return `
<div class="standings-block">
  <div class="standings-header">
    <span class="standings-title">${meta.label}</span>
    <span class="standings-subtitle">Vòng bảng</span>
  </div>
  <div class="standings-table-wrap">
  <table class="standings-table">
    <thead>
      <tr>
        <th class="th-rank">#</th>
        <th class="th-team">Đội</th>
        <th>TR</th>
        <th>T</th>
        <th>H</th>
        <th>B</th>
        <th>+/-</th>
        <th>HS</th>
        <th>ĐS</th>
      </tr>
    </thead>
    <tbody>${rowsHtml}</tbody>
  </table>
  </div>
</div>`;
}

// Update standings from FotMob data when available
function applyStandingsFromFotmob(data) {
  try {
    // Structure: data.table[0].data.tables = [{leagueName:"Grp. A", table:{all:[...]}}]
    const tableData = data?.table?.[0]?.data?.tables ?? [];
    if (!tableData.length) return;

    tableData.forEach(grpObj => {
      // leagueName = "Grp. A" → group = "A"
      const leagueName = grpObj?.leagueName ?? '';
      const grpMatch = leagueName.match(/Grp\.\s*([A-L])/i);
      if (!grpMatch) return;
      const group = grpMatch[1].toUpperCase();
      if (!STANDINGS[group]) return;

      const rows = grpObj?.table?.all ?? [];
      if (!rows.length) return;

      // Update từng đội trong bảng
      rows.forEach(e => {
        const code = normName(e?.name ?? '');
        const idx  = STANDINGS[group].findIndex(t => t.code === code);
        if (idx < 0) return;

        const scoresStr = e.scoresStr ?? '';
        const [gfStr, gaStr] = scoresStr.split('-');
        const gf  = parseInt(gfStr) || 0;
        const ga  = parseInt(gaStr) || 0;
        const gd  = typeof e.goalConDiff === 'number' ? e.goalConDiff : (gf - ga);

        STANDINGS[group][idx] = {
          ...STANDINGS[group][idx],
          pl:  e.played ?? 0,
          w:   e.wins   ?? 0,
          d:   e.draws  ?? 0,
          l:   e.losses ?? 0,
          gf,
          ga,
          gd,
          pts: e.pts ?? 0,
          rank: e.idx ?? (idx + 1),
        };
      });

      // Sort theo: pts → hiệu số → bàn thắng → fair-play
      STANDINGS[group].sort(compareStandingRows);
    });
  } catch(e) { console.warn('standings parse error', e.message); }
}

function renderAll() {
  const list = MATCHES.filter(m => {
    const teamOk = matchHasTeam(m, currentFilter);

    const roundOk = currentFilter !== 'all' ||
      currentRoundFilter === 'all' ||
      m.round === currentRoundFilter;

    // Group filter: áp dụng khi tab = 'all' và không phải KO round view
    const isKoView = currentFilter === 'all' && KO_ROUNDS.has(currentView);
    // Khi view='group', loại KO rounds ra khỏi list
    const isGroupView = currentFilter === 'all' && currentView === 'group';
    if (isGroupView && KO_ROUNDS.has(m.g)) return false;
    const groupOk = isKoView ||
      !(currentFilter === 'all' && currentGroupFilter !== 'all') ||
      m.g === currentGroupFilter ||
      m.id === currentGroupFilter;

    return teamOk && roundOk && groupOk;
  });

  let html = '';

  if (currentFilter === 'all' && KO_ROUNDS.has(currentView)) {
    // ── Vòng knockout cụ thể ─────────────────────────────────
    const groups = {};
    list.filter(m => m.g === currentView)
        .forEach(m => { (groups[m.g] = groups[m.g] || []).push(m); });
    const keys = Object.keys(groups).sort();
    keys.forEach(g => {
      const meta = GROUP_META[g] || { label: g, teams: '' };
      html += `
      <div class="group-block">
        <div class="group-label-row">
          <span class="group-pill">${meta.label}</span>
          <span class="group-teams-text">${meta.teams}</span>
        </div>
        ${groups[g].map(renderMatchRow).join('')}
      </div>`;
    });

  } else if (currentFilter === 'all' && currentView === 'date') {
    // ── Theo ngày: sort by date+time, group by date ──────────
    const sorted = [...list].sort((a, b) => {
      const da = a.date + 'T' + a.time;
      const db = b.date + 'T' + b.time;
      return da < db ? -1 : da > db ? 1 : 0;
    });

    const byDate = {};
    sorted.forEach(m => { (byDate[m.date] = byDate[m.date] || []).push(m); });

    const DAYS = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
    Object.keys(byDate).sort().forEach(dateStr => {
      const d = new Date(dateStr + 'T12:00:00+07:00');
      const label = DAYS[d.getDay()] + ' · ' + d.getDate().toString().padStart(2,'0') + '/' + (d.getMonth()+1).toString().padStart(2,'0');
      html += `
      <div class="group-block" data-date="${dateStr}">
        <div class="group-label-row">
          <span class="group-pill">${label}</span>
          <span class="group-teams-text">${byDate[dateStr].length} trận</span>
        </div>
        ${byDate[dateStr].map(renderMatchRow).join('')}
      </div>`;
    });

  } else if (currentFilter === 'all' && currentView === 'group') {
    // ── Theo bảng: hiện bảng A-L (theo filter dropdown) + phần vòng KO ──

    // Phần vòng bảng — ẩn khi đang xem Best 3rd
    if (!showBest3) {
      const groupMatches = list.filter(m => !KO_ROUNDS.has(m.g));
      const filteredGroupMatches = currentGroupFilter === 'all'
        ? groupMatches
        : groupMatches.filter(m => m.g === currentGroupFilter);

      const groups = {};
      filteredGroupMatches.forEach(m => { (groups[m.g] = groups[m.g] || []).push(m); });
      const groupKeys = Object.keys(groups).sort();

      groupKeys.forEach(g => {
        const meta = GROUP_META[g] || { label:'Bảng '+g, teams:'' };
        html += `
        <div class="group-block">
          <div class="group-label-row">
            <span class="group-pill">${meta.label}</span>
            <span class="group-teams-text">${meta.teams}</span>
          </div>
          ${groups[g].map(renderMatchRow).join('')}
        </div>`;
      });
    }

    // Chỉ hiện vòng bảng A-L, không hiện KO (KO xem qua các tab riêng)
    // Bảng hạng 3 tốt nhất
    if (showBest3) {
      html += renderThirdPlaceTable();
    } else if (currentGroupFilter === 'all') {
      // Không tự hiện bảng hạng 3 nữa — dùng button
    }

  } else {
    // ── Tab đội tuyển ─────────────────────────────────────────
    const groups = {};
    list.forEach(m => { (groups[m.g] = groups[m.g] || []).push(m); });
    const keys = Object.keys(groups).sort();

    keys.forEach(g => {
      const meta = GROUP_META[g] || { label:'BẢNG '+g, teams:'' };
      html += `
      <div class="group-block">
        <div class="group-label-row">
          <span class="group-pill">${meta.label}</span>
          <span class="group-teams-text">${meta.teams}</span>
        </div>
        ${groups[g].map(renderMatchRow).join('')}
      </div>`;
    });
  }

  // Standings when team tab selected
  if (currentFilter !== 'all' && TEAM_GROUP[currentFilter]) {
    const group = TEAM_GROUP[currentFilter];
    html += `<div class="standings-section-label">Bảng xếp hạng</div>`;
    html += renderStandingsTable(group, currentFilter);
  }

  document.getElementById('matchContainer').innerHTML = html;
  document.getElementById('emptyState').classList.toggle('show', list.length === 0);
}

// Polling interval logic:
// - Đang có trận LIVE  → 30 giây
// - Hôm nay có trận    → 60 phút
// - Không có trận hôm nay → không poll
const LIVE_POLL_MS = 30_000;
const TODAY_POLL_MS = 60 * 60_000;
let _pollTimer = null;
let _isFetching = false;
let _lastPollAt = null;

function getMatchDay() {
  // Trả về ngày VN hiện tại dạng YYYYMMDD
  const now = new Date();
  const vn  = new Date(now.getTime() + 7 * 3600000); // UTC+7
  return vn.toISOString().slice(0,10).replace(/-/g,'');
}

function hasLiveMatch() {
  return MATCHES.some(m => m.status === 'live');
}

function hasTodayMatch() {
  const today = getMatchDay();
  return MATCHES.some(m => m.date.replace(/-/g,'') === today);
}

function getPollInterval() {
  if (hasLiveMatch())   return LIVE_POLL_MS;   // 30s khi có trận đang đấu
  if (hasTodayMatch())  return TODAY_POLL_MS;  // 60 phút khi hôm nay có trận chưa đấu
  return null;                                 // Không có trận → không poll
}

function schedulePoll() {
  clearTimeout(_pollTimer);
  const interval = getPollInterval();
  if (interval === null) {
    setBarText('Không có trận hôm nay · ');
    return; // Không schedule poll
  }
  const label = interval < 60000 ? `${interval/1000}s`
              : interval < 3600000 ? `${interval/60000} phút`
              : `${interval/3600000} giờ`;
  setBarText(`⏱ Tự động cập nhật mỗi <span>${label}</span> · `);
  _pollTimer = setTimeout(() => fetchFotmob(true), interval);
}

// ── Main fetch: FotMob /api/leagues?id=77 ─────────────────────
async function fetchFotmob(auto = false) {
  // Nếu lần fetch trước còn chạy quá lâu, không để polling bị chết.
  // Hẹn thử lại sau 5s thay vì return im lặng.
  if (_isFetching) {
    console.log('[Poll] previous fetch still running; retry in 5s');
    clearTimeout(_pollTimer);
    _pollTimer = setTimeout(() => fetchFotmob(true), 5_000);
    return;
  }
  _isFetching = true;
  _lastPollAt = Date.now();

  const btn = document.getElementById('updateBtn');
  const spinner = document.getElementById('barSpinner');
  btn.disabled = true;
  spinner.classList.add('on');
  setBarEm('📡');
  if (!auto) setBarText('<span>Đang lấy dữ liệu...</span>');

  const fotmobUrl = 'https://www.fotmob.com/api/leagues?id=77&tab=matches&type=league&timeZone=Asia%2FHo_Chi_Minh';
  // Cache-buster để browser/CDN/Worker không trả dữ liệu cũ khi poll 30s/lần
  const pollBust = Date.now();

  // Cloudflare Worker — fotmob-proxy.ductrangdesign.workers.dev
  // Worker fetch: /api/data/leagues?id=77&ccode3=VNM (confirmed working 12/06/2026)
  const WORKER_URL = 'https://fotmob-proxy.ductrangdesign.workers.dev';

  const PROXIES = [
    {
      // 1. Cloudflare Worker riêng — ổn định nhất, deploy 1 lần dùng mãi
      name: 'CF Worker',
      url: `${WORKER_URL}?_=${pollBust}`,
      parse: t => JSON.parse(t),
      skip: false,
    },
    {
      // 2. proxy.cors.sh
      name: 'proxy.cors.sh',
      url: `https://proxy.cors.sh/${fotmobUrl}&_=${pollBust}`,
      parse: t => JSON.parse(t),
    },
    {
      // 3. allorigins /raw
      name: 'allorigins raw',
      url: `https://api.allorigins.win/raw?url=${encodeURIComponent(fotmobUrl + '&_=' + pollBust)}`,
      parse: t => JSON.parse(t),
    },
    {
      // 4. allorigins /get — JSON wrapper
      name: 'allorigins get',
      url: `https://api.allorigins.win/get?url=${encodeURIComponent(fotmobUrl + '&_=' + pollBust)}`,
      parse: t => { const w = JSON.parse(t); return JSON.parse(w.contents); },
    },
    {
      // 5. corsproxy.io format mới
      name: 'corsproxy.io',
      url: `https://corsproxy.io/?url=${encodeURIComponent(fotmobUrl + '&_=' + pollBust)}`,
      parse: t => JSON.parse(t),
    },
  ];

  let success = false;
  for (const proxy of PROXIES) {
    if (proxy.skip) continue;
    try {
      const opts = {
        cache: 'no-store',
        headers: {
          'Cache-Control': 'no-cache, no-store, must-revalidate',
          'Pragma': 'no-cache',
          ...(proxy.headers || {})
        }
      };
      const res = await fetch(proxy.url, opts);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const data = proxy.parse(text);
      const events = parseEvents(data);
      if (!events.length) {
        console.warn('[FotMob] proxy ok but 0 events:', proxy.url.slice(0,40));
        // vẫn thử applyFotmobData để cập nhật standings nếu có
        applyFotmobData(data);
        success = true;
        break;
      }
      console.log('[FotMob] success via:', proxy.url.slice(0,50), '| events:', events.length);
      try { applyFotmobData(data); } catch(applyErr) { console.error('[FotMob] applyFotmobData error:', applyErr.message); }
      success = true;
      break;
    } catch (err) {
      console.warn('[FotMob] proxy failed:', proxy.url.slice(0,50), err.message);
    }
  }

  if (!success) {
    setBarEm('⚠️');
    setBarText('Không kết nối được FotMob. <span>Thử lại sau...</span>');

  _isFetching = false;
  btn.disabled = false;
  spinner.classList.remove('on');
  schedulePoll();
}

function getFlag(code) {
  return FLAG_MAP[code] || '\u{1F3F3}\uFE0F';

// ── Extract VN-date (YYYY-MM-DD) from FotMob event ────────────
function evDate(ev) {
  try {
    const t = ev?.status?.utcTime ?? ev?.matchDate ?? '';
    if (!t) return '';
    const d = new Date(t);
    d.setHours(d.getHours() + 7); // UTC+7
    return d.toISOString().slice(0,10);
  } catch { return ''; }
}

// ── Map FotMob stage string → our group key ────────────────────
function koGroup(stageName) {
  if (!stageName || typeof stageName !== 'string') return null;
  const s = stageName.toLowerCase();
  // Order matters: check 'semi' before 'final', 'quarter' before '16'
  if (s.includes('semi'))                                              return 'SF';
  if (s.includes('third') || s.includes('bronze') || s.includes('3rd')) return 'TP';
  if (s.includes('quarter') || s.includes('quarter-final'))           return 'QF';
  if (s.includes('round of 32') || s.includes('r32'))                 return 'R32';
  if (s.includes('round of 16') || s.includes('r16'))                 return 'R16';
  // FotMob sometimes uses "1/8" or "1/16" as round names
  if (/\b1\/16\b/.test(s))  return 'R32';
  if (/\b1\/8\b/.test(s))   return 'R16';
  if (/\b1\/4\b/.test(s))   return 'QF';
  // "final" must come after semi-final check
  if (s.includes('final'))     return 'FIN';
  return null;
}

// ── Try multiple FotMob response structures ────────────────────
function parseEvents(data) {
  const paths = [
    // ✅ /api/data/leagues format (confirmed 12/06/2026)
    () => data?.fixtures?.allMatches,
    () => data?.matches?.allMatches,
    () => data?.matches?.data?.events,
    () => data?.data?.events,
    () => data?.events,
    () => data?.response,
    () => data?.pageProps?.initialData?.allMatches,
    () => data?.rounds?.flatMap(r => r.matches ?? r.events ?? []),
    () => data?.playoff?.rounds?.flatMap(r => r.matches ?? r.events ?? []),
    () => data?.matches?.rounds?.flatMap(r => r.matches ?? []),
    () => Array.isArray(data) ? data : null,
  ];
  for (const fn of paths) {
    try { const r = fn(); if (Array.isArray(r) && r.length) return r; } catch {}
  }
  return [];
}

// ── isTBD: FotMob sometimes fills "Winner Match X" as placeholder
function isTBD(name) {
  if (!name) return true;
  const n = name.toLowerCase();
  return n === 'tbd'
    || n.includes('winner')
    || n.includes('loser')
    || n.includes('match')
    || n.includes('placeholder')
    || n.includes('pending')
    || n.includes('qualified')
    || n.includes('runner')
    || n === '-'
    || n === '?'
    || /^nhất\s[a-l]$/i.test(name.trim())   // our own placeholders
    || /^nhì\s[a-l]$/i.test(name.trim())
    || /^hạng 3/.test(name.trim());
}

function applyFotmobData(data) {
  const events = parseEvents(data);

  console.log('[FotMob] top keys:', Object.keys(data || {}));
  console.log('[FotMob] events found:', events.length);
  if (events.length > 0) {
    console.log('[FotMob] first event keys:', Object.keys(events[0]));
    console.log('[FotMob] first event sample:', JSON.stringify(events[0]).slice(0, 400));
  }

  if (!events.length) {
    setBarEm('\u26A0\uFE0F');
    setBarText('FotMob: <span>Ch\u01B0a c\u00F3 d\u1EEF li\u1EC7u tr\u1EADn \u0111\u1EA5u</span>');
    setTs('Ki\u1EC3m tra l\u00FAc ' + nowVN() + ' · Gi\u1EA3i \u0111\u1EA5u: 11/6/2026');
    return;
  }

  let changed = 0;

  // ── Sort events by utcTime ─────────────────────────────────────
  const sorted = [...events].sort((a,b) => {
    const ta = a?.status?.utcTime ?? a?.matchDate ?? '';
    const tb = b?.status?.utcTime ?? b?.matchDate ?? '';
    return ta < tb ? -1 : ta > tb ? 1 : 0;
  });

  // ── Build: byTeams map for group stage ────────────────────────
  const byTeams = {};
  sorted.forEach(ev => {
    const hn = ev?.home?.name ?? ev?.homeTeam?.name ?? '';
    const an = ev?.away?.name ?? ev?.awayTeam?.name ?? '';
    const hc = normName(hn), ac = normName(an);
    if (hc && ac && !isTBD(hn) && !isTBD(an)) {
      byTeams[hc + '_' + ac] = ev;
    }
  });

  // ── Build: byStageIdx map for knockout ────────────────────────
  const byStage = {};
  sorted.forEach(ev => {
    // New API format: ev.group = "A" / "R32" / "QF" etc.
    const directGroup = ev?.group ?? '';
    const KO_KEYS = ['R32','R16','QF','SF','TP','FIN'];
    if (KO_KEYS.includes(directGroup)) {
      if (!byStage[directGroup]) byStage[directGroup] = [];
      byStage[directGroup].push(ev);
      return;
    }
    // Fallback: parse from stage name string
    const stageName = ev?.stage?.name ?? ev?.tournament?.name
                   ?? ev?.leagueName ?? ev?.roundName ?? '';
    const kg = koGroup(stageName);
    if (kg) {
      if (!byStage[kg]) byStage[kg] = [];
      byStage[kg].push(ev);
    }
  });

  // ── Also build: byDateOrder for fallback date+position matching
  const byDateOrder = {};
  const dayCounter = {};
  sorted.forEach(ev => {
    const d = evDate(ev);
    if (!d) return;
    dayCounter[d] = (dayCounter[d] || 0);
    byDateOrder[d + '_' + dayCounter[d]] = ev;
    dayCounter[d]++;
  });

  // ── Track MATCHES iteration counters ─────────────────────────
  const matchDayCounter = {};
  const matchStageCounter = {};

  MATCHES.forEach(m => {
    const isKO = ['R32','R16','QF','SF','TP','FIN'].includes(m.g);
    let ev = null;

    if (!isKO) {
      // ── Group stage: match by team codes ──────────────────────
      ev = byTeams[m.home.code + '_' + m.away.code]
        ?? byTeams[m.away.code + '_' + m.home.code]
        ?? null;

    } else {
      // ── Knockout: Strategy 1 — match by stage + position ──────
      const stageEvs = byStage[m.g] ?? [];
      if (!matchStageCounter[m.g]) matchStageCounter[m.g] = 0;
      const si = matchStageCounter[m.g];
      if (si < stageEvs.length) {
        ev = stageEvs[si];
        matchStageCounter[m.g]++;
      }

      // Strategy 2 fallback — match by date+position if stage map failed
      if (!ev) {
        const dk = m.date + '_' + (matchDayCounter[m.date] ?? 0);
        ev = byDateOrder[dk] ?? null;
      }

      // ── Update team names/flags from FotMob ───────────────────
      if (ev) {
        const hn = ev?.home?.name ?? ev?.homeTeam?.name ?? '';
        const an = ev?.away?.name ?? ev?.awayTeam?.name ?? '';
        const hc = normName(hn), ac = normName(an);

        if (!isTBD(hn) && hc && hc !== m.home.code) {
          m.home.name  = hn;
          m.home.code  = hc;
          m.home.flag  = getFlag(hc);
          m.home.color = '#666';
          changed++;
        }
        if (!isTBD(an) && ac && ac !== m.away.code) {
          m.away.name  = an;
          m.away.code  = ac;
          m.away.flag  = getFlag(ac);
          m.away.color = '#666';
          changed++;
        }
      }
    }

    // Track date counter
    matchDayCounter[m.date] = (matchDayCounter[m.date] ?? 0) + 1;

    if (!ev) return;

    // ── Update score + status ─────────────────────────────────
    const started  = ev?.status?.started  ?? false;
    const finished = ev?.status?.finished ?? false;
    const newSt    = finished ? 'finished' : started ? 'live' : 'upcoming';

    // ── Live phase: phút thi đấu + hết hiệp 1 ────────────────
    // FotMob: status.liveTime.short = "58'" khi đang đá
    // status.halfs.secondHalfStarted = null khi đang nghỉ giữa hiệp
    let newMinute = null;
    let newPhase  = null;

    if (newSt === 'live') {
      const halfs = ev?.status?.halfs ?? {};
      const lt = ev?.status?.liveTime?.short ?? '';
      const minMatch = String(lt).match(/(\d+)/);

      // Nghỉ giữa hiệp: firstHalf đã bắt đầu, secondHalf chưa, VÀ không có liveTime
      const isHT = halfs.firstHalfStarted
                && !halfs.secondHalfStarted
                && !minMatch;

      if (isHT) {
        newPhase = 'ht';
      } else {
        newPhase = 'live';
        if (minMatch) newMinute = parseInt(minMatch[1]);
      }
    }

    // FotMob score: thử nhiều format khác nhau theo version API
    let rawSH = ev?.home?.score        // format cũ
             ?? ev?.homeTeam?.score
             ?? ev?.homeScore?.current // format mới
             ?? ev?.homeScore?.display
             ?? null;
    let rawSA = ev?.away?.score
             ?? ev?.awayTeam?.score
             ?? ev?.awayScore?.current
             ?? ev?.awayScore?.display
             ?? null;

    // Fallback: parse từ scoreStr = "2 - 1" hoặc "2-1"
    if ((rawSH === null || rawSA === null) && ev?.status?.scoreStr) {
      const parts = ev.status.scoreStr.replace(/\s/g,'').split('-');
      if (parts.length === 2) {
        const ph = parseInt(parts[0]), pa = parseInt(parts[1]);
        if (!isNaN(ph)) rawSH = ph;
        if (!isNaN(pa)) rawSA = pa;
      }
    }
    // Fallback 2: liveTime có scoreStr
    if ((rawSH === null || rawSA === null) && ev?.liveTime?.short) {
      const parts = String(ev.liveTime.short).replace(/\s/g,'').split('-');
      if (parts.length === 2) {
        const ph = parseInt(parts[0]), pa = parseInt(parts[1]);
        if (!isNaN(ph) && !isNaN(pa)) { rawSH = ph; rawSA = pa; }
      }
    }

    const newSH = rawSH !== null && rawSH !== undefined ? Number(rawSH) : null;
    const newSA = rawSA !== null && rawSA !== undefined ? Number(rawSA) : null;

    const prevSH = m.sh, prevSA = m.sa, prevSt = m.status;
    m.status = newSt;
    m.sh = newSH;
    m.sa = newSA;
    m.minute = newMinute;
    m.livePhase = newPhase;
    ensureLiveDisplayData(m);
    if (ev?.id) m.fotmobId = String(ev.id);
    if (prevSH !== newSH || prevSA !== newSA || prevSt !== newSt) changed++;
  });

  // ── Update standings ──────────────────────────────────────────
  try { applyStandingsFromFotmob(data); } catch {}

  // ── Re-render trước ───────────────────────────────────────────
  renderAll();
  if (changed > 0) {
    MATCHES.forEach(m => {
      if (m.sh !== null) { flashScore('sh-' + m.id); flashScore('sa-' + m.id); }
    });
  }

  // ── Fetch cards async (re-render lại sau khi xong) ────────────
  fetchCardsForFinishedMatches();

  const interval = getPollInterval();
  const nextLabel = interval < 60000   ? interval/1000 + 's'
                  : interval < 3600000 ? interval/60000 + ' ph\u00FAt'
                  : interval/3600000 + ' gi\u1EDD';
  setBarEm('\u2705');
  setBarText('C\u1EADp nh\u1EADt t\u1EEB FotMob \u00B7 <span>t\u1EF1 \u0111\u1ED9ng m\u1ED7i ' + nextLabel + '</span>');
  setTs('L\u00FAc ' + nowVN() + ' \u00B7 ' + events.length + ' tr\u1EADn \u00B7 ' + changed + ' thay \u0111\u1ED5i');
  hideAiBox();
}

function nowVN() {
  return new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
}

// ─────────────────────────────────────────────────────────────
// CARD DATA — fetch từ Worker → FotMob match details / leagueDataForMatch
// Worker v5: /match/:id dùng /api/data/matchDetails trước, fallback /api/matchDetails
// ─────────────────────────────────────────────────────────────
const WORKER_BASE = 'https://fotmob-proxy.ductrangdesign.workers.dev';


// Cache thẻ theo từng trận để không cộng trùng sau mỗi lần refresh.
// Key ưu tiên là fotmobId, fallback là matchNo/id nội bộ.
const MATCH_CARD_DATA = {};

function makeCardKey(m) {
  return String(m?.fotmobId || m?.matchNo || m?.id || '');
}

function ensureDisciplineTeam(code) {
  if (!code) return;
  if (!DISCIPLINE[code]) DISCIPLINE[code] = { yellow: 0, yellowRed: 0, red: 0, yellowDirectRed: 0 };
}

function resetDisciplineTotals() {
  Object.keys(DISCIPLINE).forEach(code => {
    DISCIPLINE[code].yellow = 0;
    DISCIPLINE[code].yellowRed = 0;
    DISCIPLINE[code].red = 0;
    DISCIPLINE[code].yellowDirectRed = 0;
  });
}

function recalcDisciplineFromMatchCards() {
  resetDisciplineTotals();
  Object.values(MATCH_CARD_DATA).forEach(c => {
    ensureDisciplineTeam(c.homeCode);
    ensureDisciplineTeam(c.awayCode);
    DISCIPLINE[c.homeCode].yellow    += c.homeYC || 0;
    DISCIPLINE[c.homeCode].yellowRed += c.homeYR || 0;
    DISCIPLINE[c.homeCode].red       += c.homeRC || 0;
    DISCIPLINE[c.homeCode].yellowDirectRed += c.homeYDR || 0;
    DISCIPLINE[c.awayCode].yellow    += c.awayYC || 0;
    DISCIPLINE[c.awayCode].yellowRed += c.awayYR || 0;
    DISCIPLINE[c.awayCode].red       += c.awayRC || 0;
    DISCIPLINE[c.awayCode].yellowDirectRed += c.awayYDR || 0;
  });
}

function setMatchCards(m, c) {
  const key = makeCardKey(m);
  if (!key) return;

  const normalized = {
    homeCode: m.home.code,
    awayCode: m.away.code,
    homeYC: Number(c.homeYC || 0),
    homeYR: Number(c.homeYR || 0),
    homeRC: Number(c.homeRC || 0),
    homeYDR: Number(c.homeYDR || 0),
    awayYC: Number(c.awayYC || 0),
    awayYR: Number(c.awayYR || 0),
    awayRC: Number(c.awayRC || 0),
    awayYDR: Number(c.awayYDR || 0),
  };

  MATCH_CARD_DATA[key] = normalized;

  // Dữ liệu hiển thị trên card trận: RC hiển thị là tổng thẻ đỏ trực tiếp + đỏ gián tiếp.
  m.homeYC = normalized.homeYC;
  m.homeYR = normalized.homeYR;
  m.homeRC = normalized.homeRC + normalized.homeYR + normalized.homeYDR;
  m.awayYC = normalized.awayYC;
  m.awayYR = normalized.awayYR;
  m.awayRC = normalized.awayRC + normalized.awayYR + normalized.awayYDR;
  m.cardsLoaded = true;

  recalcDisciplineFromMatchCards();
}

function emptyCards() {
  return { homeYC: 0, homeYR: 0, homeRC: 0, homeYDR: 0, awayYC: 0, awayYR: 0, awayRC: 0, awayYDR: 0 };
}

function addCard(result, isHome, kind) {
  const side = isHome ? 'home' : 'away';
  if (kind === 'yellow') result[side + 'YC']++;
  if (kind === 'yellowRed') result[side + 'YR']++;
  if (kind === 'red') result[side + 'RC']++;
  if (kind === 'yellowDirectRed') result[side + 'YDR']++;
}

function normalizeCardType(raw) {
  const t = String(raw || '').toLowerCase().replace(/[\s_\-]/g, '');
  if (!t) return null;

  // FotMob thường trả type="Card" và loại thẻ nằm ở field card/cardType.
  // Vì vậy phải đọc nhiều field, không được chỉ đọc type trước.
  if (t.includes('yellowdirectred') || t.includes('yellowanddirectred') || t.includes('yellowstraightred') || t.includes('yellowandredcard') || t.includes('yellowthenred') || t.includes('yellowredcarddirect')) return 'yellowDirectRed';
  if (t === '2' || t.includes('yellowred') || t.includes('secondyellow') || t.includes('secondbooking') || t.includes('redyellow')) return 'yellowRed';
  if (t === '3' || t.includes('redcard') || t === 'red' || t.includes('straightred') || t.includes('directred') || t.includes('sendingoff')) return 'red';
  if (t === '1' || t.includes('yellowcard') || t === 'yellow' || t.includes('booking')) return 'yellow';
  return null;
}

function detectCardKind(obj) {
  if (!obj || typeof obj !== 'object') return null;

  // Ưu tiên field mô tả loại thẻ thật.
  const primaryFields = [
    obj.card, obj.cardType, obj.cardDescription, obj.cardName, obj.cardClass,
    obj.incidentClass, obj.eventType, obj.eventTypeName, obj.incidentType,
    obj.incidentName, obj.name, obj.title, obj.type, obj.subType, obj.typeName,
    obj.action, obj.kind, obj.reason, obj.comment, obj.text, obj.description, obj.displayText
  ];

  for (const v of primaryFields) {
    const kind = normalizeCardType(v);
    if (kind) return kind;
  }

  // Một số payload chỉ ghi type="Card" + text/comment có chữ Yellow/Red.
  const typeText = String(obj.type ?? obj.eventType ?? obj.incidentType ?? '').toLowerCase();
  if (typeText.includes('card')) {
    const text = [obj.text, obj.comment, obj.description, obj.displayText, obj.player?.name]
      .filter(Boolean).join(' ').toLowerCase();
    if (text.includes('yellow') && (text.includes('direct red') || text.includes('straight red'))) return 'yellowDirectRed';
    if (text.includes('second yellow')) return 'yellowRed';
    if (text.includes('yellow')) return 'yellow';
    if (text.includes('red')) return 'red';
  }

  return null;
}

function detectIsHome(obj, detail) {
  if (!obj || typeof obj !== 'object') return null;

  if (typeof obj.isHome === 'boolean') return obj.isHome;
  if (typeof obj.isHomeTeam === 'boolean') return obj.isHomeTeam;
  if (typeof obj.home === 'boolean') return obj.home;

  const general = detail?.general || detail?.header || detail?.content?.matchFacts?.info || {};
  const homeId = general?.homeTeam?.id ?? general?.homeTeam?.teamId ?? detail?.homeTeam?.id ?? detail?.home?.id;
  const awayId = general?.awayTeam?.id ?? general?.awayTeam?.teamId ?? detail?.awayTeam?.id ?? detail?.away?.id;

  const teamId = obj.teamId ?? obj.team?.id ?? obj.team?.teamId ?? obj.participantId ?? obj.contestantId;
  if (teamId && homeId && String(teamId) === String(homeId)) return true;
  if (teamId && awayId && String(teamId) === String(awayId)) return false;

  // Một số stats/events dùng side/team là home/away.
  const side = String(obj.side ?? obj.teamSide ?? obj.teamType ?? obj.team ?? obj.homeAway ?? obj.ha ?? '').toLowerCase();
  if (side === 'home' || side === 'h' || side.includes('hometeam')) return true;
  if (side === 'away' || side === 'a' || side.includes('awayteam')) return false;

  // Dò theo tên đội nếu event chỉ có teamName/team.name
  const homeName = String(general?.homeTeam?.name ?? detail?.homeTeam?.name ?? detail?.home?.name ?? '').toLowerCase();
  const awayName = String(general?.awayTeam?.name ?? detail?.awayTeam?.name ?? detail?.away?.name ?? '').toLowerCase();
  const teamName = String(obj.teamName ?? obj.team?.name ?? obj.contestantName ?? obj.participantName ?? '').toLowerCase();
  if (teamName && homeName && (teamName === homeName || homeName.includes(teamName) || teamName.includes(homeName))) return true;
  if (teamName && awayName && (teamName === awayName || awayName.includes(teamName) || teamName.includes(awayName))) return false;

  return null;
}

function getStatNumber(v) {
  if (v === null || v === undefined) return 0;
  if (typeof v === 'number') return Number.isFinite(v) ? v : 0;
  if (typeof v === 'string') {
    const m = v.replace(',', '.').match(/-?\d+(?:\.\d+)?/);
    return m ? Number(m[0]) : 0;
  }
  if (typeof v === 'object') {
    const x = v.value ?? v.stat ?? v.count ?? v.total ?? v.displayValue ?? v.title ?? v.name;
    return getStatNumber(x);
  }
  return 0;
}

function statLabelOf(obj) {
  if (!obj || typeof obj !== 'object') return '';
  return [
    obj.title, obj.name, obj.key, obj.type, obj.statName, obj.label,
    obj.displayName, obj.localizedTitle, obj.question, obj.text
  ].filter(Boolean).join(' ').toLowerCase();
}

function getStatPair(obj) {
  // Trả về [home, away] nếu object giống một dòng stats.
  const candidates = [
    obj.stats,
    obj.values,
    obj.statsData,
    obj.value,
    obj.stat,
  ];

  // Dạng {home: 2, away: 1} hoặc {homeValue, awayValue}
  const homeVal = obj.home ?? obj.homeValue ?? obj.homeStat ?? obj.homeTeamValue ?? obj.h;
  const awayVal = obj.away ?? obj.awayValue ?? obj.awayStat ?? obj.awayTeamValue ?? obj.a;
  if (homeVal !== undefined || awayVal !== undefined) return [getStatNumber(homeVal), getStatNumber(awayVal)];

  for (const c of candidates) {
    if (!c) continue;
    if (Array.isArray(c) && c.length >= 2) return [getStatNumber(c[0]), getStatNumber(c[1])];
    if (typeof c === 'object') {
      const h = c.home ?? c.homeValue ?? c.homeStat ?? c[0];
      const a = c.away ?? c.awayValue ?? c.awayStat ?? c[1];
      if (h !== undefined || a !== undefined) return [getStatNumber(h), getStatNumber(a)];
    }
  }

  return null;
}


function walkObjects(root, callback) {
  // Duyệt sâu toàn bộ object/array FotMob, chống vòng lặp.
  // Lỗi hiện tại “walkObjects is not defined” làm parser thẻ dừng ngay sau khi fetch OK.
  const seen = new WeakSet();

  function visit(node) {
    if (!node || typeof node !== 'object') return;
    if (seen.has(node)) return;
    seen.add(node);

    if (!Array.isArray(node)) callback(node);

    if (Array.isArray(node)) {
      for (const item of node) visit(item);
      return;
    }

    for (const key in node) {
      if (Object.prototype.hasOwnProperty.call(node, key)) {
        visit(node[key]);
      }
    }
  }

  visit(root);
}

function parseCardsFromMatchDetail(detail, homeCode, awayCode) {
  const result = emptyCards();
  const seenEvents = new Set();

  // 1) Ưu tiên timeline/events trong matchDetails vì phân biệt được đỏ trực tiếp và đỏ gián tiếp.
  walkObjects(detail, obj => {
    const kind = detectCardKind(obj);
    if (!kind) return;

    const isHome = detectIsHome(obj, detail);
    if (isHome === null) return;

    // Chống đếm trùng khi cùng một event xuất hiện ở nhiều nhánh dữ liệu.
    const eventKey = [
      obj.id ?? obj.eventId ?? obj.incidentId ?? obj.time ?? obj.minute ?? '',
      obj.playerId ?? obj.player?.id ?? obj.player?.name ?? obj.name ?? '',
      isHome ? 'H' : 'A',
      kind,
    ].join('|');
    if (seenEvents.has(eventKey)) return;
    seenEvents.add(eventKey);

    addCard(result, isHome, kind);
  });

  const eventTotal = result.homeYC + result.homeYR + result.homeRC + result.awayYC + result.awayYR + result.awayRC;
  if (eventTotal > 0) return result;

  // 2) Fallback: stats chỉ có tổng Yellow cards / Red cards.
  // Không phân biệt được vàng→đỏ, nên đưa Red cards vào RC trực tiếp.
  walkObjects(detail, obj => {
    const label = statLabelOf(obj);
    if (!(label.includes('card') || label.includes('booking') || label.includes('discipline'))) return;

    const pair = getStatPair(obj);
    if (!pair) return;
    const [homeN, awayN] = pair;

    if (label.includes('yellow')) {
      result.homeYC = Math.max(result.homeYC, homeN);
      result.awayYC = Math.max(result.awayYC, awayN);
    } else if (label.includes('red')) {
      result.homeRC = Math.max(result.homeRC, homeN);
      result.awayRC = Math.max(result.awayRC, awayN);
    }
  });

  return result;
}

async function fetchMatchDetails(matchId) {
  // Lấy cả 2 route vì /match/data có thể OK nhưng không chứa event thẻ.
  // Nếu route đầu trả 0 thẻ, vẫn phải thử /match/:id.
  const attempts = [
    { url: `${WORKER_BASE}/match/data/${matchId}`, label: 'leagueData' },
    { url: `${WORKER_BASE}/match/${matchId}`,      label: 'matchDetails' },
  ];
  const out = [];

  for (const a of attempts) {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 12000);
      const res = await fetch(a.url, { cache: 'no-cache', signal: controller.signal });
      clearTimeout(timer);

      const text = await res.text();
      if (!res.ok || !text || text.length < 20) {
        console.warn(`[Cards] ${a.label} bad response:`, res.status, text?.slice(0,120));
        continue;
      }

      const data = JSON.parse(text);
      if (data?.error) {
        console.warn(`[Cards] ${a.label} error:`, data.fotmobStatus, data.fotmobPreview?.slice(0,120));
        continue;
      }

      console.log(`[Cards] ${a.label} OK for matchId=${matchId}`);
      out.push({ label: a.label, data });
    } catch(e) {
      console.warn(`[Cards] ${a.label} exception:`, e.message);
    }
  }
  return out;
}

function totalCards(c) {
  return (c.homeYC||0)+(c.homeYR||0)+(c.homeRC||0)+(c.awayYC||0)+(c.awayYR||0)+(c.awayRC||0);
}

function chooseBestCardResult(results) {
  // Ưu tiên result có tổng thẻ lớn hơn. Nếu bằng nhau, ưu tiên matchDetails vì có event chi tiết hơn stats.
  let best = emptyCards();
  let bestLabel = 'empty';
  for (const r of results) {
    const t = totalCards(r.cards);
    const bt = totalCards(best);
    if (t > bt || (t === bt && r.label === 'matchDetails' && bestLabel !== 'matchDetails')) {
      best = r.cards;
      bestLabel = r.label;
    }
  }
  return { cards: best, label: bestLabel };
}

async function fetchCardsForFinishedMatches() {
  const pending = MATCHES.filter(m =>
    m.status === 'finished' &&
    m.fotmobId &&
    !m.cardsLoaded &&
    String(m.g || '').length === 1 // chỉ cần vòng bảng cho Best 3rd
  );
  if (!pending.length) return;

  console.log(`[Cards] fetching ${pending.length} finished group matches...`);
  let anyLoaded = false;

  for (const m of pending) {
    try {
      const details = await fetchMatchDetails(m.fotmobId);
      if (!details.length) {
        // Không set cardsLoaded=true khi lỗi mạng/Worker để lần refresh sau còn thử lại.
        m.cardsError = true;
        continue;
      }

      const parsed = details.map(d => ({
        label: d.label,
        cards: parseCardsFromMatchDetail(d.data, m.home.code, m.away.code)
      }));
      const picked = chooseBestCardResult(parsed);
      const c = picked.cards;
      setMatchCards(m, c);
      console.log(`[Cards] ✅ M${m.matchNo || m.id} ${m.home.code} vs ${m.away.code} via ${picked.label} YC:${c.homeYC}-${c.awayYC} YR:${c.homeYR}-${c.awayYR} RC:${c.homeRC}-${c.awayRC}`);
      if (totalCards(c) === 0) {
        console.warn(`[Cards] M${m.matchNo || m.id} fetched OK but no card fields found. Run debugCards(${m.matchNo || ''}) to inspect payload.`);
      }
      anyLoaded = true;
    } catch(e) {
      console.warn(`[Cards] err ${m.fotmobId}:`, e.message);
    }
  }

  if (anyLoaded) renderAll();
}

// Debug tool — gọi từ console: debugCards()
window.debugCards = async function(matchNo) {
  const m = MATCHES.find(x => (matchNo ? x.matchNo === Number(matchNo) : x.status === 'finished') && x.fotmobId);
  if (!m) { console.log('Không tìm thấy trận. Ví dụ: debugCards(1)'); return; }
  console.log(`Test matchId=${m.fotmobId} M${m.matchNo} (${m.home.code} vs ${m.away.code})`);
  const details = await fetchMatchDetails(m.fotmobId);
  for (const d of details) {
    console.log('---', d.label, '---');
    const cards = parseCardsFromMatchDetail(d.data, m.home.code, m.away.code);
    console.log('parsed:', cards);
    let found = 0;
    walkObjects(d.data, obj => {
      const label = statLabelOf(obj);
      const kind = detectCardKind(obj);
      if (kind || label.includes('card') || label.includes('booking') || label.includes('discipline')) {
        if (found < 25) console.log('card-like', { kind, label, obj });
        found++;
      }
    });
    console.log('card-like objects:', found);
  }
};

// Public trigger (button)
function handleRefreshClick() {
  const btn = document.getElementById('updateBtn');
  btn.classList.remove('spinning');
  void btn.offsetWidth; // reflow
  btn.classList.add('spinning');
  fetchLiveScores();
}

function fetchLiveScores() {
  clearTimeout(_pollTimer);
  fetchFotmob(false);
}

// ── Auto-scroll to today (or nearest future date) ─────────────
function scrollToToday(isInit = false) {
  // Only in "Tất cả" + "Theo ngày" view
  if (currentFilter !== 'all' || currentView !== 'date') return;

  // Get today in VN timezone (YYYY-MM-DD)
  const now = new Date();
  const vnNow = new Date(now.getTime() + 7 * 3600000);
  const today = vnNow.toISOString().slice(0, 10);

  // Find all date group-blocks
  const blocks = Array.from(document.querySelectorAll('[data-date]'));
  if (!blocks.length) return;

  // 1. Exact today
  let target = blocks.find(b => b.dataset.date === today);

  // 2. No match → nearest future date
  if (!target) {
    const future = blocks
      .filter(b => b.dataset.date > today)
      .sort((a,b) => a.dataset.date.localeCompare(b.dataset.date));
    target = future[0] ?? null;
  }

  // 3. Still no match → nearest past date (latest)
  if (!target) {
    const past = blocks
      .filter(b => b.dataset.date < today)
      .sort((a,b) => b.dataset.date.localeCompare(a.dataset.date));
    target = past[0] ?? null;
  }

  if (!target) return;

  // Offset: site-header(132px) + select-box sticky(45px) + buffer
  const selectWrap = document.getElementById('groupSelectWrap');
  const selectH = (selectWrap && selectWrap.classList.contains('show')) ? selectWrap.offsetHeight : 0;
  const stickyH = 136 + selectH + 6;

  if (isInit) {
    // On initial load: instant scroll (no animation) so user sees correct position
    const rect = target.getBoundingClientRect();
    const scrollY = window.scrollY + rect.top - stickyH;
    window.scrollTo({ top: Math.max(0, scrollY), behavior: 'instant' });
  } else {
    // On manual re-render: smooth scroll
    const rect = target.getBoundingClientRect();
    const scrollY = window.scrollY + rect.top - stickyH;
    window.scrollTo({ top: Math.max(0, scrollY), behavior: 'smooth' });
  }
}


// Khi tab/app quay lại foreground, kiểm tra ngay nếu đang có trận live.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && hasLiveMatch()) {
    clearTimeout(_pollTimer);
    fetchFotmob(true);
  }
});
window.addEventListener('focus', () => {
  if (hasLiveMatch()) {
    clearTimeout(_pollTimer);
    fetchFotmob(true);
  }
});

(function init() {
  // Auto-detect live từ đồng hồ client
  const now = Date.now();
  MATCHES.forEach(m => {
    if (m.status === 'finished') return;
    const start = new Date(m.date + 'T' + m.time + ':00+07:00').getTime();
    const end   = start + 2.5 * 3600000; // 2h30 buffer
    if (now >= start && now <= end) {
      m.status = 'live';
      ensureLiveDisplayData(m);
    }
  });

  renderAll();
  // Nếu client tự phát hiện trận live, schedule poll 30s ngay cả trước khi fetch đầu tiên hoàn tất
  schedulePoll();
  // Show view switcher by default (tab 'all' is active)
  const viewBar = document.getElementById('viewBar');
  if (viewBar) viewBar.classList.add('show');
  // Select bảng: chỉ show khi filter=all và view không phải KO (mặc định view='date')
  const groupWrap = document.getElementById('groupSelectWrap');
  if (groupWrap) groupWrap.classList.toggle('show', !KO_ROUNDS.has(currentView));

  // Scroll to today after DOM is painted
  requestAnimationFrame(() => {
    requestAnimationFrame(() => scrollToToday(true));
  });

  // Auto-fetch khi load — Worker ổn định
  setTimeout(() => fetchFotmob(false), 800);
})();
